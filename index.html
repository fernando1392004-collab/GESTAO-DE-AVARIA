<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#eaf4f2;--card:rgba(255,255,255,.68);--tx:#103d3b;--mut:#62817d;--bd:rgba(75,157,151,.2);--ac:#119b91;--act:#fff;--dg:#c45c55;--deep:#075b5b;--mint:#bce8e2;--glass:rgba(255,255,255,.55);--shadow:0 18px 48px rgba(8,76,72,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;min-height:100vh;color:var(--tx);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 10% 0%,#d1eeea 0,transparent 42%),radial-gradient(ellipse at 95% 28%,#d5e9e8 0,transparent 38%),linear-gradient(145deg,#edf6f4,#e4f0ee 60%,#f4f8f7);background-attachment:fixed}
#app{max-width:720px;margin:0 auto;padding:28px 18px 125px}h1{font-size:27px;line-height:1.15;margin:4px 0 8px;letter-spacing:-.8px;font-weight:800}h2{font-size:12px;margin:25px 0 10px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.12em}p{color:var(--mut)}button{font:inherit;color:inherit;cursor:pointer}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#278d85;font-weight:800}.subtitle{margin:0 0 22px;color:var(--mut)}
.hero{position:relative;overflow:hidden;padding:25px;border-radius:28px;color:#effffb;background:linear-gradient(135deg,#075b5b,#0e8981 60%,#39b8a9);box-shadow:0 20px 45px rgba(5,91,91,.22);margin:10px 0 22px}.hero:after{content:"";position:absolute;width:230px;height:230px;border:1px solid rgba(255,255,255,.22);border-radius:50%;right:-65px;top:-95px;box-shadow:0 0 0 22px rgba(255,255,255,.05),0 0 0 48px rgba(255,255,255,.04)}.hero h1{font-size:29px;max-width:360px}.hero p{color:rgba(239,255,251,.75);margin:8px 0 0;max-width:340px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:16px 0 22px}.stat{padding:14px 12px;border:1px solid var(--bd);border-radius:18px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}.stat b{display:block;font-size:21px;color:var(--deep)}.stat span{font-size:11px;color:var(--mut)}
.big,.item,.ent,.sum,.task,.panel{background:var(--glass);border:1px solid rgba(255,255,255,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}.big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:20px;padding:16px;margin:0 0 10px}.big .glyph{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#d5f3ed,#a9dfd8);font-size:21px;color:#08716b;flex:none}.big .desc{flex:1;min-width:0}.big b{font-size:16px;display:block}.big span{color:var(--mut);font-size:12px}.big .chev{font-size:22px;color:#58a49d}
.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.btn{background:linear-gradient(135deg,#087a75,#18a99b);color:white;border:0;border-radius:14px;padding:13px 16px;font-weight:750;width:100%;box-shadow:0 8px 18px rgba(11,139,130,.18)}.btn.sec{background:rgba(255,255,255,.68);color:var(--deep);border:1px solid var(--bd);box-shadow:none}.btn.dg{background:transparent;color:var(--dg);border:1px solid rgba(196,92,85,.4);box-shadow:none}.back{background:none;border:0;color:var(--ac);padding:6px 0;font-weight:700}.item{display:flex;justify-content:space-between;align-items:center;width:100%;border-radius:15px;padding:13px 14px;margin-bottom:8px;text-align:left}.item small{color:var(--mut);display:block}.tag{font-size:12px;color:#16867e;white-space:nowrap;background:#d9f1ed;padding:5px 10px;border-radius:20px}.ent{display:flex;gap:10px;align-items:center;border-radius:16px;padding:9px;margin-bottom:8px}.ent img,.ent .ph{width:54px;height:54px;border-radius:11px;object-fit:cover;background:#d6eae6;flex:none}.ent .nm{flex:1;min-width:0;font-weight:700}.ent input{width:78px;text-align:right;padding:8px}.x{background:none;border:0;color:var(--dg);font-size:22px;padding:4px 8px}.sum,.panel{border-radius:18px;padding:10px 15px}.sum div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.sum div:last-child{border:0}input,select,textarea{font:inherit;color:var(--tx);background:rgba(255,255,255,.76);border:1px solid var(--bd);border-radius:12px;padding:12px;width:100%;outline-color:#35aaa0}label{display:block;font-size:12px;color:var(--mut);font-weight:700;margin:13px 0 5px}
#sheet{position:fixed;inset:0;background:rgba(5,42,41,.35);backdrop-filter:blur(5px);display:none;align-items:flex-end;z-index:8}#sheet.on{display:flex}#sheet .in{background:rgba(245,252,250,.94);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);width:100%;max-width:720px;margin:0 auto;border:1px solid white;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;box-shadow:0 -18px 60px rgba(4,63,59,.18)}#prev{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#075b5b;color:#fff;padding:11px 17px;border-radius:22px;font-size:13px;display:none;z-index:12;max-width:90%;box-shadow:0 10px 30px #064c4b44}
.bottom-nav{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(690px,calc(100% - 28px));display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;align-items:end;padding:8px 10px 7px;border-radius:25px;border:1px solid rgba(255,255,255,.82);background:rgba(238,250,247,.72);box-shadow:0 16px 50px rgba(7,79,75,.18);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5)}.nav-btn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 2px;color:#668984;font-size:10px;font-weight:700}.nav-btn .ico{font-size:19px;line-height:1.1}.nav-btn.active{color:#087c75}.nav-btn.home-center{margin-top:-25px}.nav-btn.home-center .ico{width:52px;height:52px;display:grid;place-items:center;border-radius:19px;background:linear-gradient(145deg,#08716b,#22b7a8);color:#fff;font-size:23px;box-shadow:0 9px 20px #087b7450;border:3px solid #eaf7f4}.nav-btn.home-center span:last-child{margin-top:1px}
.task{display:flex;align-items:center;gap:11px;border-radius:16px;padding:13px;margin-bottom:9px}.task .check{width:23px;height:23px;border-radius:8px;border:1.5px solid #65aaa2;background:#fff;display:grid;place-items:center;flex:none;color:#fff}.task.done .check{background:#15988e;border-color:#15988e}.task .taskname{flex:1;font-weight:700}.task.done .taskname{text-decoration:line-through;color:#88a39f}.task .taskmeta{font-size:11px;color:var(--mut);display:block}.task .x{font-size:19px}.empty{padding:22px;text-align:center;color:var(--mut);background:var(--glass);border:1px dashed #9fcac4;border-radius:18px}
@media(min-width:600px){#app{padding-top:38px}.hero{padding:32px}.big{padding:18px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"><div class="in" id="sin"></div></div>
<div id="toast"></div>
<nav class="bottom-nav" aria-label="Menu principal"></nav>
<input type="file" id="pf" accept="image/*" capture="environment" hidden>
<input type="file" id="rf" accept=".json,application/json" hidden>
<script>
const SECS={
folhagem:{nome:'Folhagem',sub:'Fornecedor 1651: Wictor'},
pele:{nome:'Pele e Osso',sub:'Itens de açougue'},
flv:{nome:'FLV',sub:'Descarte Hotfrut'}};
const I=(n,u)=>({n,u,c:''}),G=(n,g)=>({n,u:'kg',c:'',g});
const DEF={folhagem:[I('Alface regional','un'),I('Cebolinha','un'),I('Jambu','un'),I('Cheiro verde','un'),I('Chicória','un'),I('Kit folhagem','un'),I('Salsa','un'),I('Agrião','un'),I('Macaxeira','kg')],
pele:[G('Osso Traseiro','Traseiro'),G('Pele Traseira','Traseiro'),G('Saco Traseiro','Traseiro'),G('Osso Dianteiro','Dianteiro'),G('Pele Dianteira','Dianteiro'),G('Saco Dianteiro','Dianteiro'),G('Cabeça de Lombo','Caixaria'),G('Pele PA/Costela','Caixaria'),G('Saco PA/Costela','Caixaria')],
flv:[I('Tomate','kg'),I('Brócolis','kg'),I('Pitaya','kg'),I('Alface americano','kg'),I('Berinjela','kg'),I('Maçã nacional','kg'),I('Tangerina importada','kg'),I('Limão','kg'),I('Repolho verde','kg'),I('Coco','un'),I('Abacaxi','un')]};
let S={v:3,items:JSON.parse(JSON.stringify(DEF)),entries:{folhagem:[],pele:[],flv:[]},tasks:[]};
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(view==='home')render()});
let view='home',sheet=null,photo=null,armed=false;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UL={kg:'kg',un:'un',cx:'cx'};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
/* storage */
let db=null;
function openDb(){return new Promise(r=>{try{const q=indexedDB.open('descarte',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function load(){db=await openDb();let found=null;try{if(db)found=await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){}if(found&&found.items){S=found}else{try{const r=await fetch('default-data.json');if(r.ok)S=await r.json()}catch(e){} }migrate();save()}
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{db&&db.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(e){}},200)}
/* helpers */
const dt=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const fmt=n=>String(Math.round(n*1000)/1000).replace('.',',');
function totals(k){const m={},p={};S.entries[k].forEach(e=>{m[e.item]=(m[e.item]||0)+e.qty;(p[e.item]=p[e.item]||[]).push(e.qty)});return Object.keys(m).map(n=>{const it=S.items[k].find(x=>x.n===n)||{u:'un',c:''};return{n,q:m[n],u:it.u,c:it.c,g:it.g,p:p[n]}})}
function compress(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
const GR=['Traseiro','Dianteiro','Caixaria'];
const REN={'osso traseiro':['Osso Traseiro','Traseiro'],'pele traseira':['Pele Traseira','Traseiro'],'saco traseiro':['Saco Traseiro','Traseiro'],'osso diant':['Osso Dianteiro','Dianteiro'],'saco diant':['Saco Dianteiro','Dianteiro'],'pele diant':['Pele Dianteira','Dianteiro'],'cabeça de lombo (caixaria)':['Cabeça de Lombo','Caixaria'],'pele pa/costela':['Pele PA/Costela','Caixaria'],'saco pa/costela':['Saco PA/Costela','Caixaria']};
function migrate(){S.tasks=Array.isArray(S.tasks)?S.tasks:[];if(S.v>=3)return;const map={};
S.items.pele=S.items.pele.map(it=>{const r=REN[it.n.toLowerCase()];if(r){map[it.n]=r[0];return{...it,n:r[0],u:'kg',g:r[1]}}return{...it,u:'kg',g:it.g||'Caixaria'}});
S.entries.pele.forEach(e=>{if(map[e.item])e.item=map[e.item]});S.v=3}
function itemBtn(it,i){return '<button class="item" data-a="reg" data-i="'+i+'"><span>'+esc(it.n)+'<small>'+(it.c?'Código '+esc(it.c):'sem código')+'</small></span><span class="tag">'+UL[it.u]+' ＋</span></button>'}
function itemsHtml(k){const L=S.items[k];if(k!=='pele')return '<h2>Itens</h2>'+L.map(itemBtn).join('');
return GR.map(g=>{const r=L.map((it,i)=>[it,i]).filter(p=>p[0].g===g);return r.length?'<h2>'+g+'</h2>'+r.map(p=>itemBtn(p[0],p[1])).join(''):''}).join('')}
function pes(k,e){const L=S.entries[k].filter(x=>x.item===e.item);return[L.indexOf(e)+1,L.length]}
/* views */
function render(){$('#app').innerHTML=view==='home'?home():secView()}
function nav(){const tabs=[['reports','▤','Relatórios'],['tasks','✓','Tarefas'],['home','⌂','Início'],['catalog','▦','Itens'],['backup','↥','Backup']];$('.bottom-nav').innerHTML=tabs.map(([id,ico,label])=>'<button class="nav-btn '+(view===id?'active ':'')+(id==='home'?'home-center':'')+'" data-a="tab" data-tab="'+id+'"><span class="ico">'+ico+'</span><span>'+label+'</span></button>').join('')}
function render(){$('#app').innerHTML=view==='home'?home():view==='reports'?reportsView():view==='catalog'?catalogView():view==='tasks'?tasksView():backupView();nav()}
function home(){const count=Object.values(S.entries).reduce((a,x)=>a+x.length,0),pending=S.tasks.filter(t=>!t.done).length;return '<div class="eyebrow">Painel de controle</div><div class="hero"><div class="eyebrow" style="color:#bcebe4">GESTÃO • DESCARTE</div><h1>Organização simples. Controle completo.</h1><p>Registre, acompanhe e mantenha tudo organizado em um só lugar.</p></div><div class="stats"><div class="stat"><b>'+count+'</b><span>Registros ativos</span></div><div class="stat"><b>'+Object.values(S.items).reduce((a,x)=>a+x.length,0)+'</b><span>Itens cadastrados</span></div><div class="stat"><b>'+pending+'</b><span>Tarefas pendentes</span></div></div><h2>Áreas do sistema</h2>'+Object.keys(SECS).map((k,i)=>{const n=S.entries[k].length;const icons=['🥬','🥩','🥦'];return '<button class="big" data-a="open" data-k="'+k+'"><span class="glyph">'+icons[i]+'</span><span class="desc"><b>'+SECS[k].nome+'</b><span>'+SECS[k].sub+' · '+n+' registro(s)</span></span><span class="chev">›</span></button>'}).join('')+'<h2>Acesso rápido</h2><div class="row"><button class="btn sec" data-a="tab" data-tab="tasks">＋ Nova tarefa</button><button class="btn sec" data-a="tab" data-tab="catalog">Gerenciar itens</button></div>'+(dip?'<button class="btn" data-a="inst" style="margin-top:14px">Instalar aplicativo</button>':'')}
function reportsView(){return '<div class="eyebrow">Registros por categoria</div><h1>Relatórios</h1><p class="subtitle">Escolha uma área para lançar quantidades e gerar o PDF.</p>'+Object.keys(SECS).map((k,i)=>'<button class="big" data-a="open" data-k="'+k+'"><span class="glyph">'+['🥬','🥩','🥦'][i]+'</span><span class="desc"><b>'+SECS[k].nome+'</b><span>'+S.entries[k].length+' registro(s) · '+SECS[k].sub+'</span></span><span class="chev">›</span></button>').join('')}
function catalogView(){let out='<div class="eyebrow">Cadastro mestre</div><h1>Itens cadastrados</h1><p class="subtitle">Edite nomes, unidades, códigos e grupos. As alterações refletem nos próximos registros.</p>';Object.keys(SECS).forEach(k=>{out+='<h2>'+SECS[k].nome+'</h2>';out+=S.items[k].map((it,i)=>'<div class="item"><span><b>'+esc(it.n)+'</b><small>'+esc(it.u)+(it.g?' · '+esc(it.g):'')+(it.c?' · Código '+esc(it.c):'')+'</small></span><span class="row" style="flex:0 0 auto"><button class="btn sec" style="width:auto;padding:8px 11px" data-a="edititem" data-k="'+k+'" data-i="'+i+'">Editar</button><button class="x" data-a="delitem" data-k="'+k+'" data-i="'+i+'" aria-label="Excluir">×</button></span></div>').join('');out+='<button class="btn sec" data-a="newitem" data-k="'+k+'">＋ Adicionar em '+SECS[k].nome+'</button>'});return out}
function tasksView(){const done=S.tasks.filter(t=>t.done).length;return '<div class="eyebrow">Organização diária</div><h1>Lista de tarefas</h1><p class="subtitle">Acompanhe o que precisa ser feito e marque cada etapa concluída.</p><div class="stats"><div class="stat"><b>'+S.tasks.length+'</b><span>Total</span></div><div class="stat"><b>'+S.tasks.filter(t=>!t.done).length+'</b><span>Pendentes</span></div><div class="stat"><b>'+done+'</b><span>Concluídas</span></div></div><button class="btn" data-a="newtask">＋ Adicionar tarefa</button><h2>Minhas tarefas</h2>'+(S.tasks.length?S.tasks.map(t=>'<div class="task '+(t.done?'done':'')+'"><button class="check" data-a="toggleTask" data-id="'+t.id+'">'+(t.done?'✓':'')+'</button><span class="taskname">'+esc(t.name)+'<span class="taskmeta">'+(t.due?'Prazo: '+esc(t.due):'Sem prazo')+'</span></span><button class="x" data-a="delTask" data-id="'+t.id+'">×</button></div>').join(''):'<div class="empty">Nenhuma tarefa por aqui. Adicione sua primeira tarefa.</div>')+(done?'<button class="btn dg" style="margin-top:12px" data-a="clearDone">Excluir tarefas concluídas</button>':'')}
function backupView(){return '<div class="eyebrow">Segurança dos dados</div><h1>Backup e sincronização</h1><p class="subtitle">Exporte seus registros e restaure uma cópia quando precisar.</p><div class="panel"><h2 style="margin-top:5px">Backup manual</h2><p>O arquivo inclui itens cadastrados, registros, fotos e tarefas.</p><div class="row"><button class="btn" data-a="bk">Criar backup</button><button class="btn sec" data-a="rs">Restaurar backup</button></div></div><h2>Sobre o armazenamento</h2><div class="panel"><b>Salvo neste dispositivo</b><p style="margin-bottom:0">Atualmente, os dados ficam no armazenamento local do navegador (IndexedDB). Para sincronizar entre celulares e computadores, será necessário conectar um banco de dados na nuvem.</p></div>'}
function secView(){const k=view,E=S.entries[k],T=totals(k);return '<button class="back" data-a="tab" data-tab="reports">‹ Voltar aos relatórios</button><div class="eyebrow">Lançamento de dados</div><h1>'+SECS[k].nome+'</h1>'+itemsHtml(k)+'<button class="btn sec" data-a="new">＋ Novo item nesta categoria</button><h2>Registros lançados</h2>'+(E.length?E.map(e=>'<div class="ent">'+(e.photo?'<img src="'+e.photo+'" alt="">':'<div class="ph"></div>')+'<div class="nm">'+esc(e.item)+(pes(k,e)[1]>1?'<small style="display:block;color:var(--mut);font-weight:400">Pesagem '+pes(k,e)[0]+' de '+pes(k,e)[1]+'</small>':'')+'</div><input inputmode="decimal" value="'+fmt(e.qty)+'" data-a="q" data-id="'+e.id+'"><button class="x" data-a="del" data-id="'+e.id+'" aria-label="Remover">×</button></div>').join(''):'<div class="empty">Nenhum registro lançado nesta categoria.</div>')+(T.length?'<h2>Resumo</h2><div class="sum">'+T.map(t=>'<div><span>'+esc(t.n)+(t.c?' <small style="color:var(--mut)">#'+esc(t.c)+'</small>':'')+(t.p.length>1?' <small style="color:var(--mut)">('+t.p.map(fmt).join(' + ')+')</small>':'')+'</span><b>'+fmt(t.q)+' '+t.u+'</b></div>').join('')+'</div>':'')+(E.length?'<div style="margin-top:16px"><button class="btn dg" data-a="clr">'+(armed?'Toque de novo para apagar tudo':'Novo relatório (limpar)')+'</button></div>':'')+'<div style="margin-top:14px"><button class="btn" data-a="pdf">Salvar PDF</button></div>'}
function openSheet(h){$('#sin').innerHTML=h;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');sheet=null;photo=null}
function regSheet(i){const it=S.items[view][i];sheet={i};photo=null;const ex=S.entries[view].filter(e=>e.item===it.n),tot=ex.reduce((s,e)=>s+e.qty,0);
openSheet('<h1 style="margin:0">'+esc(it.n)+'</h1>'+(ex.length?'<p style="color:var(--mut);margin:4px 0 0">'+ex.length+' pesagem'+(ex.length>1?'ns':'')+' registrada'+(ex.length>1?'s':'')+' | total '+fmt(tot)+' '+UL[it.u]+'</p>':'')+'<label>Código do produto</label><input id="cod" value="'+esc(it.c)+'" placeholder="Digite o código"><label>Foto</label><button class="btn sec" data-a="ph">Tirar / escolher foto</button><img id="prev" alt=""><label>Quantidade ('+UL[it.u]+')</label><input id="qty" inputmode="decimal" placeholder="0"><button class="btn" data-a="more" style="margin-top:16px">Salvar e adicionar outra pesagem</button><div class="row" style="margin-top:8px"><button class="btn sec" data-a="cl">Cancelar</button><button class="btn sec" data-a="add">Salvar e fechar</button></div>')}
function newSheet(){sheet={n:1};openSheet('<h1 style="margin:0">Novo item</h1><label>Nome</label><input id="nn">'+(view==='pele'?'<select id="nu" style="display:none">':'<label>Unidade</label><select id="nu">')+'<option value="un">Unidade (un)</option><option value="kg">Peso (kg)</option><option value="cx">Caixa (cx)</option></select>'+(view==='pele'?'<label>Grupo</label><select id="ng"><option value="Traseiro">Traseiro</option><option value="Dianteiro">Dianteiro</option><option value="Caixaria">Caixaria</option></select>':'')+'<label>Código do produto</label><input id="cod" placeholder="Digite o código"><div class="row" style="margin-top:16px"><button class="btn sec" data-a="cl">Cancelar</button><button class="btn" data-a="sn">Salvar item</button></div>')}
function editItemSheet(k,i){const it=S.items[k][i];sheet={mode:'edititem',k,i};openSheet('<h1 style="margin:0">Editar item</h1><label>Nome</label><input id="nn" value="'+esc(it.n)+'"><label>Unidade</label><select id="nu"><option value="un" '+(it.u==='un'?'selected':'')+'>Unidade (un)</option><option value="kg" '+(it.u==='kg'?'selected':'')+'>Peso (kg)</option><option value="cx" '+(it.u==='cx'?'selected':'')+'>Caixa (cx)</option></select>'+(k==='pele'?'<label>Grupo</label><select id="ng">'+GR.map(g=>'<option '+(it.g===g?'selected':'')+'>'+g+'</option>').join('')+'</select>':'')+'<label>Código do produto</label><input id="cod" value="'+esc(it.c||'')+'"><div class="row" style="margin-top:16px"><button class="btn sec" data-a="cl">Cancelar</button><button class="btn" data-a="saveitem">Salvar alterações</button></div>')}
function newTaskSheet(){sheet={mode:'newtask'};openSheet('<h1 style="margin:0">Nova tarefa</h1><label>O que precisa ser feito?</label><input id="taskname" placeholder="Ex.: Conferir estoque de folhagem"><label>Prazo (opcional)</label><input id="taskdue" type="date"><div class="row" style="margin-top:16px"><button class="btn sec" data-a="cl">Cancelar</button><button class="btn" data-a="saveTask">Adicionar tarefa</button></div>')}
/* actions */
document.addEventListener('click',async ev=>{
const b=ev.target.closest('[data-a]');if(!b){if(ev.target.id==='sheet')closeSheet();return}
const a=b.dataset.a,k=view;
if(a==='tab'){view=b.dataset.tab;armed=false;render();scrollTo(0,0)}
else if(a==='open'){view=b.dataset.k;armed=false;render();scrollTo(0,0)}
else if(a==='reg')regSheet(+b.dataset.i);
else if(a==='new')newSheet();
else if(a==='newitem'){view=b.dataset.k;newSheet()}
else if(a==='edititem')editItemSheet(b.dataset.k,+b.dataset.i);
else if(a==='delitem'){const cat=b.dataset.k,i=+b.dataset.i,it=S.items[cat][i];if(!confirm('Excluir “'+it.n+'” do cadastro?'))return;S.items[cat].splice(i,1);if(!S.items[cat].some(x=>x.n===it.n))S.entries[cat]=S.entries[cat].filter(e=>e.item!==it.n);save();render();toast('Item excluído')}
else if(a==='saveitem'){const old=S.items[sheet.k][sheet.i],name=$('#nn').value.trim();if(!name){toast('Informe o nome');return}const prev=old.n;old.n=name;old.u=$('#nu').value;old.c=$('#cod').value.trim();if(sheet.k==='pele')old.g=$('#ng').value;if(prev!==name)S.entries[sheet.k].forEach(e=>{if(e.item===prev)e.item=name});save();closeSheet();render();toast('Item atualizado')}
else if(a==='cl')closeSheet();
else if(a==='ph')$('#pf').click();
else if(a==='add'||a==='more'){const it=S.items[k][sheet.i],q=num($('#qty').value);if(q<=0){toast('Informe a quantidade');return}it.c=$('#cod').value.trim();S.entries[k].push({id:Date.now()+Math.random(),item:it.n,qty:q,photo});save();if(a==='more'){const i=sheet.i;render();regSheet(i);toast('Pesagem salva. Registre a próxima.')}else{closeSheet();render();toast('Registro adicionado')}}
else if(a==='sn'){const n=$('#nn').value.trim();if(!n){toast('Informe o nome');return}S.items[k].push(k==='pele'?{n,u:'kg',c:$('#cod').value.trim(),g:$('#ng').value}:{n,u:$('#nu').value,c:$('#cod').value.trim()});save();closeSheet();render();toast('Item cadastrado')}
else if(a==='del'){S.entries[k]=S.entries[k].filter(e=>String(e.id)!==b.dataset.id);save();render()}
else if(a==='clr'){if(!armed){armed=true;render();setTimeout(()=>{armed=false;if(view===k)render()},4000)}else{S.entries[k]=[];armed=false;save();render()}}
else if(a==='newtask')newTaskSheet();
else if(a==='saveTask'){const name=$('#taskname').value.trim();if(!name){toast('Escreva a tarefa');return}S.tasks.push({id:Date.now()+Math.random(),name,due:$('#taskdue').value,done:false});save();closeSheet();render();toast('Tarefa adicionada')}
else if(a==='toggleTask'){const t=S.tasks.find(x=>String(x.id)===b.dataset.id);if(t)t.done=!t.done;save();render()}
else if(a==='delTask'){S.tasks=S.tasks.filter(x=>String(x.id)!==b.dataset.id);save();render()}
else if(a==='clearDone'){S.tasks=S.tasks.filter(x=>!x.done);save();render();toast('Tarefas concluídas removidas')}
else if(a==='pdf')await makePdf(k);
else if(a==='inst'&&dip){dip.prompt();dip=null;render()}
else if(a==='bk')await backup();
else if(a==='rs')$('#rf').click();
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.a==='q'){const en=S.entries[view].find(x=>String(x.id)===t.dataset.id);const q=num(t.value);if(en&&q>0){en.qty=q;save();toast('Quantidade atualizada')}}});
$('#pf').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;photo=await compress(f);const p=$('#prev');if(p&&photo){p.src=photo;p.style.display='block'}});
$('#rf').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!v.items||!v.entries)throw 0;S=v;migrate();save();view='home';render();toast('Backup restaurado')}catch(x){toast('Arquivo de backup inválido')}};r.readAsText(f)});
async function dl(name,data){const blob=data instanceof Blob?data:new Blob([data],{type:'application/json'});
try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);return true}catch(e){toast('Não foi possível salvar');return false}}
async function backup(){await dl('backup-descarte '+dt()+'.json',JSON.stringify(S))}
async function makePdf(k){
const E=S.entries[k];if(!E.length){toast('Adicione ao menos um registro');return}
if(!window.jspdf){toast('PDF indisponível (sem internet?)');return}
const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),d=dt();
const title=k==='folhagem'?'Relação de Folhagem Fornecedor 1651: Wictor REF. '+d:'Relatório Descarte '+SECS[k].nome+' REF. '+d;
const GN=[24,66,48],AC=[29,107,71],TX=[28,32,30],MU=[118,122,118],LN=[225,228,224],SF=[244,246,244];
const li=s=>new Promise(r=>{if(!s)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
const IM=new Map();await Promise.all(E.map(async e=>IM.set(e.id,await li(e.photo))));
const T=totals(k).sort((a,b)=>{const ga=k==='pele'?GR.indexOf(a.g):0,gb=k==='pele'?GR.indexOf(b.g):0;return ga-gb||S.items[k].findIndex(i=>i.n===a.n)-S.items[k].findIndex(i=>i.n===b.n)});
const fol=k==='folhagem',PW=210,M=14,CW=182;
const strip=()=>{doc.setFillColor(...GN);doc.rect(0,0,PW,2.5,'F')};
doc.setFillColor(...GN);doc.rect(0,0,PW,40,'F');
doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(170,205,184);doc.text(fol?'RELAÇÃO DE FOLHAGEM':'RELATÓRIO DE DESCARTE',M,15);
doc.setFont('helvetica','bold');doc.setFontSize(24);doc.setTextColor(255,255,255);doc.text(fol?'Fornecedor 1651: Wictor':SECS[k].nome,M,28);
doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(170,205,184);doc.text('REFERÊNCIA',PW-M,15,{align:'right'});
doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(255,255,255);doc.text(d,PW-M,26,{align:'right'});
doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...MU);doc.text(T.length+(T.length===1?' item':' itens')+'  |  '+E.length+(E.length===1?' registro':' registros'),M,47);
let y=53;
const bar=(t,cont)=>{doc.setFillColor(...GN);doc.roundedRect(M,y,CW,10,1.5,1.5,'F');doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(255,255,255);doc.text(t.n.toUpperCase()+(cont?'  (cont.)':''),M+4,y+6.7);
const r=(k==='pele'?t.g+'   |   ':'')+(t.p.length>1?t.p.length+' pesagens   |   ':'')+fmt(t.q)+' '+t.u+(t.c?'   |   Cód. '+t.c:'');
doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(200,225,210);doc.text(r,M+CW-4,y+6.5,{align:'right'});y+=14};
const COLW=89,XS=[M,M+COLW+4];
const fit=(im,w,mh)=>{if(!im)return[w,Math.min(mh,40)];const h=w*im.height/im.width;return h>mh?[mh*im.width/im.height,mh]:[w,h]};
for(const t of T){
const L=E.filter(e=>e.item===t.n),n=L.length,single=n===1;
let i=0,needBar=true;
while(i<n){
const per=single?1:2,grp=L.slice(i,i+per);
const dims=grp.map(e=>single?fit(IM.get(e.id),120,150):fit(IM.get(e.id),COLW,118));
const rh=Math.max(...dims.map(x=>x[1]));
if(y+(needBar?14:0)+rh+13>284){doc.addPage();strip();y=12;needBar=true}
if(needBar){bar(t,i>0);needBar=false}
grp.forEach((e,j)=>{const w=dims[j][0],h=dims[j][1],cx=single?(PW-w)/2:XS[j]+(COLW-w)/2;
if(IM.get(e.id)){try{doc.addImage(e.photo,'JPEG',cx,y,w,h,undefined,'FAST')}catch(z){}doc.setDrawColor(...LN);doc.setLineWidth(.3);doc.roundedRect(cx,y,w,h,1.5,1.5,'S')}
else{doc.setFillColor(...SF);doc.roundedRect(cx,y,w,h,1.5,1.5,'F');doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...MU);doc.text('Sem foto',cx+w/2,y+h/2,{align:'center'})}
const pp=pes(k,e);
doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MU);doc.text(pp[1]>1?'PESAGEM '+pp[0]+' DE '+pp[1]:'REGISTRO',cx,y+h+5);
doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...TX);doc.text(fmt(e.qty)+' '+t.u,cx+w,y+h+5.2,{align:'right'})});
y+=rh+13;i+=per}
y+=4}
const RH=6.4,rows=[];
if(k==='pele')GR.forEach(g=>{const r=T.filter(t=>t.g===g);if(r.length){rows.push({g});r.forEach(t=>rows.push(t))}});else T.forEach(t=>rows.push(t));
if(y+34>284){doc.addPage();strip();y=14}else y+=2;
doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...TX);doc.text('Resumo',M,y+4);
doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MU);doc.text('Referência '+d,PW-M,y+4,{align:'right'});y+=8;
const th=()=>{doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...MU);doc.text('ITEM',M,y+3.5);doc.text('QUANTIDADE',M+128,y+3.5,{align:'right'});doc.text('CÓDIGO',M+138,y+3.5);doc.setDrawColor(...GN);doc.setLineWidth(.4);doc.line(M,y+5,M+CW,y+5);y+=6.5};
th();
rows.forEach(r=>{if(y+RH>284){doc.addPage();strip();y=14;th()}
if(r.g){doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.setTextColor(...AC);doc.text(r.g.toUpperCase(),M,y+4.6);y+=RH;return}
doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...TX);doc.text(r.n,M,y+4.4);
if(r.p&&r.p.length>1){const wd=doc.getTextWidth(r.n);doc.setFontSize(7);doc.setTextColor(...MU);doc.text(r.p.map(fmt).join(' + '),M+wd+2.5,y+4.4)}
doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...TX);doc.text(fmt(r.q)+' '+r.u,M+128,y+4.4,{align:'right'});
doc.setFont('helvetica','normal');doc.setTextColor(...MU);doc.text(r.c||'-',M+138,y+4.4);
doc.setDrawColor(...LN);doc.setLineWidth(.2);doc.line(M,y+RH-.3,M+CW,y+RH-.3);y+=RH});
const N=doc.getNumberOfPages();for(let q=1;q<=N;q++){doc.setPage(q);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...MU);doc.text(SECS[k].nome+'  |  REF. '+d,M,290);doc.text(q+' / '+N,PW-M,290,{align:'right'})}
const name=title.replace(/[:\/\\]/g,'')+'.pdf';
if(await dl(name,doc.output('blob')))toast('PDF salvo')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{await load();render()})();
</script>
</body>
</html>
