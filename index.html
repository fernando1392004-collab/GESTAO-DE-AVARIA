<script>
const SECS={
folhagem:{nome:'Folhagem',sub:'Fornecedor 1651: Wictor'},
pele:{nome:'Pele e Osso',sub:'Itens de açougue'},
flv:{nome:'FLV',sub:'Descarte Hotfrut'}};
const I=(n,u,c='')=>({n,u,c}),G=(n,g,c='')=>({n,u:'kg',c,g});
const DEF={folhagem:[I('Alface regional','un',''),I('Cebolinha','un',''),I('Jambu','un','12938'),I('Cheiro verde','un',''),I('Chicória','un','37497'),I('Kit folhagem','un',''),I('Salsa','un',''),I('Agrião','un',''),I('Macaxeira','kg',''),I('Alface Hidropônicos','un','679091'),I('Manjericão','un','2030'),I('Vinagreira','un','38410'),I('Alavanca','un','31005'),I('Alfavaca','un','31005'),I('Maxixe','kg','9865'),I('Quiabo (un)','un','9968'),I('Quiabo (kg)','kg','9968')],
pele:[G('Osso Traseiro','Traseiro',''),G('Pele Traseira','Traseiro',''),G('Saco Traseiro','Traseiro',''),G('Osso Dianteiro','Dianteiro',''),G('Pele Dianteira','Dianteiro',''),G('Saco Dianteiro','Dianteiro',''),G('Cabeça de Lombo','Caixaria',''),G('Pele PA/Costela','Caixaria',''),G('Saco PA/Costela','Caixaria','')],
flv:[I('Tomate','kg',''),I('Brócolis','kg',''),I('Pitaya','kg',''),I('Alface americano','kg',''),I('Berinjela','kg',''),I('Maçã nacional','kg',''),I('Tangerina importada','kg',''),I('Limão','kg',''),I('Repolho verde','kg',''),I('Coco','un',''),I('Abacaxi','un','')]};
let S={v:4,items:JSON.parse(JSON.stringify(DEF)),entries:{folhagem:[],pele:[],flv:[]},done:{},tasks:[],forn:[],prod:[],ptl:[],phist:[],pbid:null};
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(view==='home')render()});
let view='menu',mgr=false,pend=null,repl=null,sheet=null,photo=null,armed=false,pfm=null,tsub='tarefas',fdl='',ntr=[],rsel=[],psub='prod';
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UL={kg:'kg',un:'un',cx:'cx'};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
/* storage */
let db=null;
function openDb(){return new Promise(r=>{try{const q=indexedDB.open('descarte',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('ph'))d.createObjectStore('ph')};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function load(){db=await openDb();if(!db)return;try{const v=await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(v&&v.items)S=v}catch(e){}migrate();await migratePh()}
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{db&&db.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(e){}},200)}
const PHM={};
function phPut(id,v){if(!db)PHM[id]=v;try{db&&db.transaction('ph','readwrite').objectStore('ph').put(v,String(id))}catch(e){}}
function phDel(id){delete PHM[id];try{db&&db.transaction('ph','readwrite').objectStore('ph').delete(String(id))}catch(e){}}
function phGet(id){if(PHM[id])return Promise.resolve(PHM[id]);return new Promise(r=>{try{if(!db)return r(null);const q=db.transaction('ph').objectStore('ph').get(String(id));q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
function thumbOf(src){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,180/Math.max(i.width,i.height,1)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.onerror=()=>r(null);i.src=src})}
async function migratePh(){let ch=false;for(const k of Object.keys(S.entries))for(const e of S.entries[k]){if(e.photo){e.thumb=await thumbOf(e.photo);phPut(e.id,e.photo);e.ph=1;delete e.photo;ch=true}}if(ch)save()}
/* helpers */
const dt=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const fmt=n=>String(Math.round(n*1000)/1000).replace('.',',');
const fmtU=(q,u)=>u==='kg'?q.toFixed(3).replace('.',','):fmt(q);
const uOf=(k,n)=>(S.items[k].find(i=>i.n===n)||{u:'un'}).u;

return '<div class="row"><input id="nfn" placeholder="Novo fornecedor, ex.: Wictor" enterkeyhint="done" autocomplete="off"><select id="nfd" style="flex:none;width:128px">'+dayOpts(fdl)+'</select><button class="btn" data-a="fa" style="flex:none;width:56px;padding:12px" aria-label="Adicionar">+</button></div>'+
(L.length?ORD.map(d=>grp(DIAS[d],L.filter(f=>String(f.d)===String(d)),String(d)===hj)).join('')+grp('Sem dia definido',L.filter(f=>f.d===''||f.d==null),false)+'<p style="color:var(--mut);font-size:13px;margin-top:14px">Toque no fornecedor quando ele chegar. A lista volta para "A receber" toda segunda-feira.</p>':'<p style="color:var(--mut)">Nenhum fornecedor ainda. Digite o nome acima e escolha o dia em que ele costuma vir.</p>')}

const AB=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const isRec=t=>!!(t.r&&t.r.length);
const dueToday=t=>isRec(t)&&t.r.includes(new Date().getDay());
const tDone=t=>isRec(t)?t.dd===dt():!!t.done;
const repLabel=r=>{r=ORD.filter(d=>r.includes(d));if(r.length===7)return'Todo dia';if(r.length===1)return(r[0]===0||r[0]===6?'Todo ':'Toda ')+DIAS[r[0]].toLowerCase();return r.map(d=>AB[d]).join(', ')};
const nextDay=t=>{const h=new Date().getDay();for(let i=1;i<=7;i++)if(t.r.includes((h+i)%7))return i===1?'amanhã':DIAS[(h+i)%7].toLowerCase();return''};
function chipsHtml(a){return '<div class="chips"><button type="button" class="chip'+(a.length===7?' on':'')+'" data-a="rd" data-d="all">Todo dia</button>'+ORD.map(d=>'<button type="button" class="chip'+(a.includes(d)?' on':'')+'" data-a="rd" data-d="'+d+'">'+AB[d]+'</button>').join('')+'</div>'}

function phDelP(id){if(!S.phist.some(b=>b.recs.some(r=>String(r.id)===String(id))))phDel(id)}
function archiveCur(title){if(!S.prod.length)return;if(!S.pbid)S.pbid=Date.now()+Math.random();
let b=S.phist.find(x=>String(x.id)===String(S.pbid));const recs=S.prod.map(r=>({...r}));
if(!b){b={id:S.pbid,title:title||'Produção '+dt(),d:dt(),ts:Date.now(),recs:[]};S.phist.push(b)}
else{const keep=new Set(recs.map(r=>String(r.id)));b.recs.forEach(r=>{if(!keep.has(String(r.id))&&!inHist(r.id,b))phDel(r.id)});if(title)b.title=title;b.ts=Date.now()}

const bTot=recs=>{let q=0,p=0;recs.forEach(r=>{q+=r.q||0;p+=r.p||0});return[q,p]};
const bMeta=b=>{const t=bTot(b.recs);return [b.d,pl(b.recs.length,'registro','registros'),t[1]?fmtU(t[1],'kg')+' kg':'',t[0]?fmt(t[0])+' un':''].filter(Boolean).join(' | ')};
function catItems(){const seen=new Set(),m=new Map(),add=(r,ts)=>{const id=String(r.id);if(seen.has(id))return;seen.add(id);const k=norm(r.n);let o=m.get(k);if(!o){o={n:r.n,c:'',cnt:0,q:0,p:0,last:0};m.set(k,o)}o.cnt++;o.q+=r.q||0;o.p+=r.p||0;const t=r.t||ts||0;if(t>=o.last){o.last=t;o.n=r.n;if(r.c)o.c=r.c}else if(!o.c&&r.c)o.c=r.c};
S.prod.forEach(r=>add(r,0));S.phist.forEach(b=>b.recs.forEach(r=>add(r,b.ts)));return [...m.values()].sort((a,b)=>a.n.localeCompare(b.n,'pt-BR'))}

async function makeProdPdf(title,list){
const E=list||S.prod;if(!E.length){toast('Registre ao menos uma produção');return}
if(!window.jspdf){toast('PDF indisponível (sem internet?)');return}
const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),d=dt();
const GN=[46,11,7],AC=[232,84,28],TX=[34,26,24],MU=[130,112,106],LN=[234,224,219],SF=[252,247,244];
const li=s=>new Promise(r=>{if(!s)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
const PW=210,M=14,CW=182,N=E.length,TT=title.toUpperCase(),PF=new Map(),IM=new Map();
for(const e of E){const f=e.ph?await phGet(e.id):null;PF.set(e.id,f);IM.set(e.id,await li(f))}
const band=()=>{doc.setFillColor(...GN);doc.rect(0,0,PW,20,'F');doc.setFont('helvetica','bold');let fs=13;doc.setFontSize(fs);while(fs>8&&doc.getTextWidth(TT)>CW-64){fs--;doc.setFontSize(fs)}doc.setTextColor(255,255,255);doc.text(TT,M,12.8);doc.setFontSize(10);doc.text('REF. '+d,PW-M-17,12.8,{align:'right'});try{doc.addImage(LOGO,'PNG',PW-M-13,3.5,13,13)}catch(z){}doc.setFillColor(...AC);doc.rect(0,20,PW,.9,'F')};
const FH=64,FY=284-FH,AY=33,MH=FY-AY-8;
E.forEach((e,i)=>{if(i)doc.addPage();band();
doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...MU);doc.text('REGISTRO '+(i+1)+' DE '+N,M,28);
const im=IM.get(e.id);let w=CW,h=70;if(im){h=CW*im.height/im.width;if(h>MH){w=MH*im.width/im.height;h=MH}}
const cx=M+(CW-w)/2;
if(im){try{doc.addImage(PF.get(e.id),'JPEG',cx,AY,w,h,undefined,'FAST')}catch(z){}doc.setDrawColor(...LN);doc.setLineWidth(.3);doc.roundedRect(cx,AY,w,h,1.5,1.5,'S')}
else{doc.setFillColor(...SF);doc.roundedRect(cx,AY,w,h,1.5,1.5,'F');doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...MU);doc.text('Sem foto',cx+w/2,AY+h/2,{align:'center'})}
doc.setFillColor(...SF);doc.setDrawColor(...GN);doc.setLineWidth(.6);doc.roundedRect(M,FY,CW,FH,3,3,'FD');
doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...AC);doc.text('PRODUTO',M+8,FY+9);
let fs=24;doc.setFontSize(fs);while(fs>12&&doc.getTextWidth(e.n)>CW-16){fs-=2;doc.setFontSize(fs)}
doc.setTextColor(...TX);
if(doc.getTextWidth(e.n)<=CW-16)doc.text(e.n,M+8,FY+20);
else{const wd=e.n.split(' ');let l1='',i2=0;for(;i2<wd.length;i2++){const t=(l1?l1+' ':'')+wd[i2];if(l1&&doc.getTextWidth(t)>CW-16)break;l1=t}
const rest=wd.slice(i2).join(' ');let l2=rest;while(l1.length>3&&doc.getTextWidth(l1)>CW-16)l1=l1.slice(0,-2);
while(l2.length>3&&doc.getTextWidth(l2)>CW-16)l2=l2.slice(0,-2);if(l2!==rest)l2=l2.trim()+'...';
doc.text(l1,M+8,FY+16);if(l2)doc.text(l2,M+8,FY+22.5)}
doc.setDrawColor(...LN);doc.setLineWidth(.3);doc.line(M+8,FY+26,M+CW-8,FY+26);
const cw=(CW-16)/3,vals=[['QUANTIDADE',e.q?fmt(e.q)+' un':'-'],['PESO',e.p?fmtU(e.p,'kg')+' kg':'-'],['CÓDIGO',e.c||'-']];
vals.forEach((v,j)=>{const x=M+8+cw*j;if(j){doc.setDrawColor(...LN);doc.line(x-4,FY+32,x-4,FY+FH-8)}
doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...MU);doc.text(v[0],x,FY+36);
let f2=20;doc.setFontSize(f2);while(f2>10&&doc.getTextWidth(v[1])>cw-8){f2--;doc.setFontSize(f2)}doc.setTextColor(...TX);doc.text(v[1],x,FY+50)})});
let tq=0,tp=0;E.forEach(e=>{tq+=e.q||0;tp+=e.p||0});
doc.addPage();band();let y=36;
doc.setFont('helvetica','bold');doc.setFontSize(24);doc.setTextColor(...TX);doc.text('Resumo',M,y);
doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...MU);doc.text(N+(N===1?' registro':' registros'),M,y+7);y+=17;
const RH=7.8,th=()=>{doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...MU);doc.text('PRODUTO',M,y+3.5);doc.text('QUANTIDADE',M+112,y+3.5,{align:'right'});doc.text('PESO',M+146,y+3.5,{align:'right'});doc.text('CÓDIGO',M+CW,y+3.5,{align:'right'});doc.setDrawColor(...GN);doc.setLineWidth(.5);doc.line(M,y+5.5,M+CW,y+5.5);y+=8};
th();
E.forEach(e=>{if(y+RH>278){doc.addPage();band();y=32;th()}
let nm=e.n;doc.setFont('helvetica','normal');doc.setFontSize(10.5);while(nm.length>3&&doc.getTextWidth(nm)>78)nm=nm.slice(0,-2);if(nm!==e.n)nm=nm.trim()+'...';
doc.setTextColor(...TX);doc.text(nm,M,y+5.2);
doc.setFont('helvetica','bold');doc.text(e.q?fmt(e.q)+' un':'-',M+112,y+5.2,{align:'right'});doc.text(e.p?fmtU(e.p,'kg')+' kg':'-',M+146,y+5.2,{align:'right'});
doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...MU);doc.text(e.c||'-',M+CW,y+5.2,{align:'right'});
doc.setDrawColor(...LN);doc.setLineWidth(.2);doc.line(M,y+RH-.4,M+CW,y+RH-.4);y+=RH});
if(y+RH>278){doc.addPage();band();y=32}
doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(...GN);doc.text('TOTAL',M,y+6);doc.text(tq?fmt(tq)+' un':'-',M+112,y+6,{align:'right'});doc.text(tp?fmtU(tp,'kg')+' kg':'-',M+146,y+6,{align:'right'});
const PN=doc.getNumberOfPages();for(let q=1;q<=PN;q++){doc.setPage(q);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...MU);doc.text(title+'  |  REF. '+d,M,291);doc.text(q+' / '+PN,PW-M,291,{align:'right'})}
if(await dl(title.replace(/[\\/:*?"<>|]/g,'')+' REF. '+d+'.pdf',doc.output('blob')))toast('PDF salvo')}

else if(a==='hpdf'){const h=sheet&&sheet.hb;closeSheet();pdfSheetP(h)}
else if(a==='hre'){const bt=S.phist.find(x=>String(x.id)===String(sheet.hb));if(!bt)return;if(String(S.pbid)===String(bt.id)){closeSheet();psub='prod';render();toast('Essa produção já está aberta');return}archiveCur();S.prod=bt.recs.map(r=>({...r}));S.pbid=bt.id;save();closeSheet();psub='prod';render();toast('Produção reaberta para edição')}
else if(a==='hdel'){if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Toque de novo';return}const bt=S.phist.find(x=>String(x.id)===String(sheet.hb));if(bt){S.phist=S.phist.filter(x=>x!==bt);if(String(S.pbid)===String(bt.id))S.pbid=null;bt.recs.forEach(r=>{if(!S.prod.some(x=>String(x.id)===String(r.id))&&!inHist(r.id))phDel(r.id)})}save();closeSheet();render();toast('Produção excluída do histórico')}
else if(a==='bk'){await backup();closeSheet()}
else if(a==='rs'){closeSheet();$('#rf').click()}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.a==='q'){const en=S.entries[view].find(x=>String(x.id)===t.dataset.id);const q=num(t.value);if(en&&q>0){en.qty=q;save()}else toast('Informe um valor maior que zero');render()}});
document.addEventListener('input',e=>{const t=e.target;if(t.classList&&t.classList.contains('nin')){let v=t.value.replace(/[^\d.,]/g,'').replace(/\./g,',');const i=v.indexOf(',');if(i>-1)v=v.slice(0,i+1)+v.slice(i+1).replace(/,/g,'');if(v!==t.value)t.value=v}});
document.addEventListener('focusin',e=>{const t=e.target;if(t.classList&&t.classList.contains('nin'))setTimeout(()=>{try{if(document.activeElement===t)t.select()}catch(x){}},30)});
$('#pf').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const prevPh=photo;photo=await compress(f);if(!photo&&sheet&&sheet.pf===2)photo=prevPh;if(repl){const en=(view==='prod'?S.prod:S.entries[view]).find(x=>String(x.id)===repl);repl=null;if(en&&photo){en.thumb=photo.thumb;en.ph=1;phPut(en.id,photo.full);save();render();toast('Foto trocada')}photo=null;return}if(pfm==='first'&&sheet&&sheet.pf){if(!photo){toast('Não foi possível ler a foto');return}if(sheet.pf===2){const pv=$('#fpv');pv&&(pv.src=photo.full);toast('Foto trocada');return}fotoSheetB();return}const p=$('#prev');if(p&&photo){p.src=photo.full;p.style.display='block'}});
$('#rf').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=async()=>{try{const v=JSON.parse(r.result);if(!v.items||!v.entries)throw 0;const ph=v.photos||{};delete v.photos;S=v;migrate();for(const k of Object.keys(S.entries))for(const e of S.entries[k])if(ph[String(e.id)]){phPut(e.id,ph[String(e.id)]);if(!e.thumb)e.thumb=await thumbOf(ph[String(e.id)]);e.ph=1}for(const e of S.prod||[])if(ph[String(e.id)]){phPut(e.id,ph[String(e.id)]);if(!e.thumb)e.thumb=await thumbOf(ph[String(e.id)]);e.ph=1}for(const b of S.phist||[])for(const e of b.recs)if(ph[String(e.id)]){phPut(e.id,ph[String(e.id)]);e.ph=1}await migratePh();save();view='home';render();toast('Backup restaurado')}catch(x){toast('Arquivo de backup inválido')}};r.readAsText(f)});
async function dl(name,data){const blob=data instanceof Blob?data:new Blob([data],{type:'application/json'});
try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);return true}catch(e){toast('Não foi possível salvar');return false}}
async function backup(){const ph={};for(const k of Object.keys(S.entries))for(const e of S.entries[k])if(e.ph){const f=await phGet(e.id);if(f)ph[String(e.id)]=f}
for(const e of S.prod||[])if(e.ph){const f=await phGet(e.id);if(f)ph[String(e.id)]=f}
for(const b of S.phist||[])for(const e of b.recs)if(e.ph&&!ph[String(e.id)]){const f=await phGet(e.id);if(f)ph[String(e.id)]=f}
await dl('backup-descarte '+dt()+'.json',JSON.stringify({...S,photos:ph}))}
async function makePdf(k){
const E=S.entries[k];if(!E.length){toast('Adicione ao menos um registro');return}
if(!window.jspdf){toast('PDF indisponível (sem internet?)');return}
const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),d=dt();
const title=k==='folhagem'?'Resumo de Folhagem Fornecedor 1651: Wictor REF. '+d:'Relatório Descarte '+SECS[k].nome+' REF. '+d;
const GN=[10,58,44],AC=[15,157,104],TX=[28,32,30],MU=[118,122,118],LN=[225,228,224],SF=[244,246,244];
const li=s=>new Promise(r=>{if(!s)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
const IM=new Map(),PF=new Map();for(const e of E){const f=e.ph?await phGet(e.id):null;PF.set(e.id,f);IM.set(e.id,await li(f))}
const T=totals(k).sort((a,b)=>{const ga=k==='pele'?GR.indexOf(a.g):0,gb=k==='pele'?GR.indexOf(b.g):0;return ga-gb||NC(a.n,b.n)});
const fol=k==='folhagem',PW=210,M=14,CW=182,COLW=89,XS=[M,M+COLW+4],U=fmtU;
const band=()=>{doc.setFillColor(...GN);doc.rect(0,0,PW,20,'F');doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,255,255);doc.text(fol?'RESUMO DE FOLHAGEM  |  FORNECEDOR 1651: WICTOR':'RELATÓRIO DE DESCARTE  |  '+SECS[k].nome.toUpperCase(),M,12.5);doc.setFontSize(11);doc.text('REF. '+d,PW-M,12.5,{align:'right'})};
const fit=(im,w,mh)=>{if(!im)return[w,Math.min(mh,40)];const h=w*im.height/im.width;return h>mh?[mh*im.width/im.height,mh]:[w,h]};
const cont=t=>{doc.addPage();band();doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(...TX);doc.text(t.n+'  (cont.)',M,32);return 42};
let first=true,y=0;
for(const t of T){
const L=E.filter(e=>e.item===t.n),n=L.length;
if(!first)doc.addPage();first=false;
band();y=32;
if(k==='pele'){doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...AC);doc.text(String(t.g).toUpperCase(),M,y);y+=4}
let fs=30;doc.setFont('helvetica','bold');doc.setFontSize(fs);while(fs>16&&doc.getTextWidth(t.n)>CW){fs-=2;doc.setFontSize(fs)}
doc.setTextColor(...TX);doc.text(t.n,M,y+10);y+=17;
const ct=t.c?'CÓD. '+t.c:'SEM CÓDIGO';doc.setFont('helvetica','bold');doc.setFontSize(12);const pw=doc.getTextWidth(ct)+10;
doc.setDrawColor(...(t.c?AC:LN));doc.setLineWidth(.5);doc.roundedRect(M,y,pw,9,4.5,4.5,'S');doc.setTextColor(...(t.c?AC:MU));doc.text(ct,M+5,y+6.3);y+=15;
doc.setFillColor(...GN);doc.roundedRect(M,y,CW,42,3,3,'F');
doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(170,205,184);doc.text('TOTAL',M+8,y+9);
const tv=U(t.q,t.u);doc.setFont('helvetica','bold');doc.setFontSize(46);doc.setTextColor(255,255,255);doc.text(tv,M+8,y+31);
const tw=doc.getTextWidth(tv);doc.setFontSize(20);doc.text(t.u,M+8+tw+3,y+31);
doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(170,205,184);doc.text(n+(n===1?' pesagem':' pesagens'),PW-M-8,y+9,{align:'right'});
if(n>1){const pr=t.p.map(x=>U(x,t.u)).join(' + '),room=CW-16-tw-34;let pf=13;doc.setFont('helvetica','bold');doc.setFontSize(pf);while(pf>7&&doc.getTextWidth(pr)>room){pf--;doc.setFontSize(pf)}doc.setTextColor(255,255,255);doc.text(pr,PW-M-8,y+31,{align:'right'})}
y+=50;
let i=0;
while(i<n){
if(284-y<76)y=cont(t);
const single=n===1,per=single?1:2,grp=L.slice(i,i+per),mh=Math.min(single?150:125,284-y-16);
const dims=grp.map(e=>single?fit(IM.get(e.id),CW,mh):fit(IM.get(e.id),COLW,mh));
const rh=Math.max(...dims.map(x=>x[1]));
grp.forEach((e,j)=>{const w=dims[j][0],h=dims[j][1],cx=single?(PW-w)/2:XS[j]+(COLW-w)/2;
if(IM.get(e.id)){try{doc.addImage(PF.get(e.id),'JPEG',cx,y,w,h,undefined,'FAST')}catch(z){}doc.setDrawColor(...LN);doc.setLineWidth(.3);doc.roundedRect(cx,y,w,h,1.5,1.5,'S')}
else{doc.setFillColor(...SF);doc.roundedRect(cx,y,w,h,1.5,1.5,'F');doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...MU);doc.text('Sem foto',cx+w/2,y+h/2,{align:'center'})}
const pp=pes(k,e);
doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(...MU);doc.text(pp[1]>1?'PESAGEM '+pp[0]+' DE '+pp[1]:'PESAGEM ÚNICA',cx,y+h+7);
doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(...TX);doc.text(U(e.qty,t.u)+' '+t.u,cx+w,y+h+7.5,{align:'right'})});
y+=rh+16;i+=per}
}
doc.addPage();band();y=36;
doc.setFont('helvetica','bold');doc.setFontSize(24);doc.setTextColor(...TX);doc.text('Resumo',M,y);
doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...MU);doc.text(T.length+(T.length===1?' item':' itens')+'  |  '+E.length+(E.length===1?' registro':' registros'),M,y+7);y+=17;
const RH=7.8,rows=[];
if(k==='pele')GR.forEach(g=>{const r=T.filter(t=>t.g===g);if(r.length){rows.push({hdr:g});r.forEach(t=>rows.push(t))}});else T.forEach(t=>rows.push(t));
const th=()=>{doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...MU);doc.text('ITEM',M,y+3.5);doc.text('PESAGENS',M+120,y+3.5,{align:'right'});doc.text('QUANTIDADE',M+154,y+3.5,{align:'right'});doc.text('CÓDIGO',M+CW,y+3.5,{align:'right'});doc.setDrawColor(...GN);doc.setLineWidth(.5);doc.line(M,y+5.5,M+CW,y+5.5);y+=8};
th();
rows.forEach(r=>{if(y+RH>284){doc.addPage();band();y=32;th()}
if(r.hdr){doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...AC);doc.text(r.hdr.toUpperCase(),M,y+5.2);y+=RH;return}
doc.setFont('helvetica','normal');doc.setFontSize(10.5);doc.setTextColor(...TX);doc.text(r.n,M,y+5.2);
let pt=r.p.length>1?r.p.map(x=>U(x,r.u)).join(' + '):'-';doc.setFontSize(8);doc.setTextColor(...MU);if(doc.getTextWidth(pt)>44)pt=r.p.length+' pesagens';doc.text(pt,M+120,y+5.2,{align:'right'});
doc.setFont('helvetica','bold');doc.setFontSize(10.5);doc.setTextColor(...TX);doc.text(U(r.q,r.u)+' '+r.u,M+154,y+5.2,{align:'right'});
doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...MU);doc.text(r.c||'-',M+CW,y+5.2,{align:'right'});
doc.setDrawColor(...LN);doc.setLineWidth(.2);doc.line(M,y+RH-.4,M+CW,y+RH-.4);y+=RH});
const N=doc.getNumberOfPages();for(let q=1;q<=N;q++){doc.setPage(q);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...MU);doc.text(SECS[k].nome+'  |  REF. '+d,M,291);doc.text(q+' / '+N,PW-M,291,{align:'right'})}
const name=title.replace(/[:\/\\]/g,'')+'.pdf';
if(await dl(name,doc.output('blob')))toast('PDF salvo')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{await load();render()})();
</script>
