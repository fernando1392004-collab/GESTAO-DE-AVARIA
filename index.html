<style>
:root{color-scheme:light;--bg:#e9f5ef;--card:rgba(255,255,255,.74);--card2:rgba(255,255,255,.88);--in:rgba(255,255,255,.62);--tx:#0e2a1f;--mut:#58766a;--bd:rgba(14,70,50,.14);--gb:rgba(255,255,255,.72);--gl:rgba(255,255,255,.6);--ac:#0f9d68;--ac2:#2ccf92;--acs:rgba(15,157,104,.13);--act:#fff;--dg:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#06140e;--card:rgba(24,56,43,.66);--card2:rgba(12,32,24,.88);--in:rgba(255,255,255,.07);--tx:#e6f6ee;--mut:#8fb8a5;--bd:rgba(255,255,255,.1);--gb:rgba(255,255,255,.13);--gl:rgba(14,36,28,.62);--ac:#34d399;--ac2:#10b981;--acs:rgba(52,211,153,.16);--act:#04120b;--dg:#f28b7a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#06140e;--card:rgba(24,56,43,.66);--card2:rgba(12,32,24,.88);--in:rgba(255,255,255,.07);--tx:#e6f6ee;--mut:#8fb8a5;--bd:rgba(255,255,255,.1);--gb:rgba(255,255,255,.13);--gl:rgba(14,36,28,.62);--ac:#34d399;--ac2:#10b981;--acs:rgba(52,211,153,.16);--act:#04120b;--dg:#f28b7a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:22px;margin:6px 0 14px}h2{font-size:15px;margin:22px 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
.big{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:10px}
.big b{font-size:19px;display:block}.big span{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.btn{background:var(--ac);color:var(--act);border:0;border-radius:12px;padding:14px;font-weight:600;width:100%}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.dg{background:transparent;color:var(--dg);border:1px solid var(--dg)}
.back{background:none;border:0;color:var(--ac);padding:6px 0;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;text-align:left}
.item small{color:var(--mut);display:block}.tag{font-size:12px;color:var(--mut);white-space:nowrap}
.ent{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px}
.ent img,.ent .ph{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--bd);flex:none}
.ent .nm{flex:1;min-width:0;font-weight:600}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px;width:100%}
.ent input{width:78px;text-align:right;padding:8px}
.x{background:none;border:0;color:var(--dg);font-size:22px;padding:4px 8px}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 14px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}.sum div:last-child{border:0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
#sheet.on{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
#prev{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:9;max-width:90%}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:3}
.bar>div{max-width:560px;margin:0 auto}
h1{font-weight:700;letter-spacing:-.01em}
.big,.item,.ent,.sum{box-shadow:0 1px 2px rgba(20,40,30,.05),0 4px 14px rgba(20,40,30,.04)}
.big{position:relative;border-radius:18px;border-left:4px solid var(--ac);padding-right:44px}
.big::after{content:"›";position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--mut)}
.btn{border-radius:14px;box-shadow:0 2px 8px rgba(29,107,71,.25)}.btn.sec,.btn.dg{box-shadow:none}
.item{border-radius:14px}.tag{background:var(--bg);padding:4px 10px;border-radius:20px}
body{min-height:100vh;background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 38% at 8% 0%,rgba(52,211,153,.38),transparent 70%),radial-gradient(55% 34% at 100% 18%,rgba(16,185,129,.26),transparent 70%),radial-gradient(70% 40% at 55% 100%,rgba(5,150,105,.28),transparent 70%)}
#app{padding-bottom:130px}
.big,.item,.ent,.sum,.btn.sec{background:var(--card);border:1px solid var(--gb)}
.btn.dg{border:1px solid var(--dg)}
input,select{background:var(--in);border:1px solid var(--bd)}
.btn{background:linear-gradient(145deg,var(--ac2),var(--ac));box-shadow:0 6px 18px rgba(15,157,104,.32)}
.btn.sec{color:var(--tx);box-shadow:none}.btn.dg{background:transparent;box-shadow:none}
.tag{background:var(--acs);color:var(--ac);font-weight:600}
.tk{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--bd);padding:14px 2px;text-align:left;color:var(--tx)}
.sum .tk:last-child{border-bottom:0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;color:transparent;font-size:15px;font-weight:700;flex:none}
.tk.dn .ck{background:linear-gradient(145deg,var(--ac2),var(--ac));border-color:transparent;color:var(--act)}
.tk .tn{flex:1;font-weight:600}.tk.dn .tn{color:var(--mut);text-decoration:line-through}
.tk small{color:var(--mut);font-size:12px}
#sheet .in{background:var(--card2);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--gb);border-bottom:0}
#isl{will-change:transform;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:center;gap:2px;padding:7px 8px;border-radius:32px;background:var(--gl);-webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);border:1px solid var(--gb);box-shadow:0 12px 32px rgba(5,40,28,.24),inset 0 1px 0 rgba(255,255,255,.5)}
#isl button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 9px;border-radius:24px;color:var(--mut);font-size:10.5px;font-weight:600;min-width:54px;-webkit-tap-highlight-color:transparent}
#isl svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#isl button.on{color:var(--ac);background:var(--acs)}
#isl .mid{background:linear-gradient(145deg,var(--ac2),var(--ac));color:var(--act);min-width:66px;padding:9px 14px;margin:0 5px;box-shadow:0 8px 18px rgba(15,157,104,.42)}
#isl .mid.on{color:var(--act);background:linear-gradient(145deg,var(--ac2),var(--ac))}
@media(max-width:360px){#isl button{min-width:46px;padding:7px 6px}#isl .mid{min-width:58px}}
.trow{display:flex;align-items:center;gap:2px}
.sum .trow{padding:0;border-bottom:1px solid var(--bd)}.sum .trow:last-child{border-bottom:0}
.trow .tk{flex:1;width:auto;border-bottom:0;padding:11px 2px}
.x.ed{color:var(--mut);font-size:18px}
</style>
</head>

<script>
const SECS={
folhagem:{nome:'Folhagem',sub:'Fornecedor 1651: Wictor'},
pele:{nome:'Pele e Osso',sub:'Itens de açougue'},
flv:{nome:'FLV',sub:'Descarte Hotfrut'}};
const I=(n,u,c='')=>({n,u,c}),G=(n,g,c='')=>({n,u:'kg',c,g});
const DEF={folhagem:[I('Alface regional','un',''),I('Cebolinha','un',''),I('Jambu','un','12938'),I('Cheiro verde','un',''),I('Chicória','un','37497'),I('Kit folhagem','un',''),I('Salsa','un',''),I('Agrião','un',''),I('Macaxeira','kg',''),I('Alface Hidropônicos','un','679091'),I('Manjericão','un','2030'),I('Vinagreira','un','38410'),I('Alavanca','un','31005'),I('Alfavaca','un','31005'),I('Maxixe','kg','9865'),I('Quiabo (un)','un','9968'),I('Quiabo (kg)','kg','9968')],
pele:[G('Osso Traseiro','Traseiro',''),G('Pele Traseira','Traseiro',''),G('Saco Traseiro','Traseiro',''),G('Osso Dianteiro','Dianteiro',''),G('Pele Dianteira','Dianteiro',''),G('Saco Dianteiro','Dianteiro',''),G('Cabeça de Lombo','Caixaria',''),G('Pele PA/Costela','Caixaria',''),G('Saco PA/Costela','Caixaria','')],
flv:[I('Tomate','kg',''),I('Brócolis','kg',''),I('Pitaya','kg',''),I('Alface americano','kg',''),I('Berinjela','kg',''),I('Maçã nacional','kg',''),I('Tangerina importada','kg',''),I('Limão','kg',''),I('Repolho verde','kg',''),I('Coco','un',''),I('Abacaxi','un','')]};
let S={v:4,items:JSON.parse(JSON.stringify(DEF)),entries:{folhagem:[],pele:[],flv:[]},done:{},tasks:[]};
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(view==='home')render()});
let view='home',mgr=false,pend=null,repl=null,sheet=null,photo=null,armed=false;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UL={kg:'kg',un:'un',cx:'cx'};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
/* storage */
let db=null;
function openDb(){return new Promise(r=>{try{const q=indexedDB.open('descarte',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('ph'))d.createObjectStore('ph')};q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function load(){db=await openDb();if(!db)return;try{const v=await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(v&&v.items)S=v}catch(e){}migrate();await migratePh()}
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{db&&db.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(e){}},200)}
const PHM={};
function phPut(id,v){if(!db)PHM[id]=v;try{db&&db.transaction('ph','readwrite').objectStore('ph').put(v,String(id))}catch(e){}}
function phDel(id){delete PHM[id];try{db&&db.transaction('ph','readwrite').objectStore('ph').delete(String(id))}catch(e){}}
function phGet(id){if(PHM[id])return Promise.resolve(PHM[id]);return new Promise(r=>{try{if(!db)return r(null);const q=db.transaction('ph').objectStore('ph').get(String(id));q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}})}
function thumbOf(src){return new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,180/Math.max(i.width,i.height,1)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.6))};i.onerror=()=>r(null);i.src=src})}
async function migratePh(){let ch=false;for(const k of Object.keys(S.entries))for(const e of S.entries[k]){if(e.photo){e.thumb=await thumbOf(e.photo);phPut(e.id,e.photo);e.ph=1;delete e.photo;ch=true}}if(ch)save()}
/* helpers */
const dt=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const fmt=n=>String(Math.round(n*1000)/1000).replace('.',',');
const fmtU=(q,u)=>u==='kg'?q.toFixed(3).replace('.',','):fmt(q);
const uOf=(k,n)=>(S.items[k].find(i=>i.n===n)||{u:'un'}).u;
function totals(k){const m={},p={};S.entries[k].forEach(e=>{m[e.item]=(m[e.item]||0)+e.qty;(p[e.item]=p[e.item]||[]).push(e.qty)});return Object.keys(m).map(n=>{const it=S.items[k].find(x=>x.n===n)||{u:'un',c:''};return{n,q:m[n],u:it.u,c:it.c,g:it.g,p:p[n]}})}
async function compress(file){let bmp=null;try{bmp=await createImageBitmap(file)}catch(e){}
if(!bmp){const u=URL.createObjectURL(file);bmp=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=u});setTimeout(()=>URL.revokeObjectURL(u),4000)}
if(!bmp)return null;const W=bmp.width,H=bmp.height,draw=(m,qq)=>{const k=Math.min(1,m/Math.max(W,H)),c=document.createElement('canvas');c.width=Math.round(W*k);c.height=Math.round(H*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return c.toDataURL('image/jpeg',qq)};
const out={full:draw(900,.7),thumb:draw(180,.6)};if(bmp.close)bmp.close();return out}
const GR=['Traseiro','Dianteiro','Caixaria'];
const REN={'osso traseiro':['Osso Traseiro','Traseiro'],'pele traseira':['Pele Traseira','Traseiro'],'saco traseiro':['Saco Traseiro','Traseiro'],'osso diant':['Osso Dianteiro','Dianteiro'],'saco diant':['Saco Dianteiro','Dianteiro'],'pele diant':['Pele Dianteira','Dianteiro'],'cabeça de lombo (caixaria)':['Cabeça de Lombo','Caixaria'],'pele pa/costela':['Pele PA/Costela','Caixaria'],'saco pa/costela':['Saco PA/Costela','Caixaria']};
function migrate(){if(!(S.v>=2))migrate2();if(!(S.v>=3))migrate3();if(!(S.v>=4)){S.tasks=S.tasks||[];S.v=4}}
function migrate3(){Object.keys(S.items).forEach(k=>{const L=S.items[k],cnt={},ren={};L.forEach(i=>cnt[i.n]=(cnt[i.n]||0)+1);L.forEach(i=>{if(cnt[i.n]>1){const nn=i.n+' ('+i.u+')';(ren[i.n]=ren[i.n]||[]).push([i,nn]);i.n=nn}});S.entries[k].forEach(e=>{const r=ren[e.item];if(r){e.item=(r.find(x=>x[0].u==='kg')||r[0])[1]}})});S.done=S.done||{};S.v=3}
function migrate2(){const map={};
S.items.pele=S.items.pele.map(it=>{const r=REN[it.n.toLowerCase()];if(r){map[it.n]=r[0];return{...it,n:r[0],u:'kg',g:r[1]}}return{...it,u:'kg',g:it.g||'Caixaria'}});
S.entries.pele.forEach(e=>{if(map[e.item])e.item=map[e.item]});S.v=2}
function itemBtn(it,i){return '<button class="item" data-a="reg" data-i="'+i+'"><span>'+esc(it.n)+'<small>'+(it.c?'Código '+esc(it.c):'sem código')+'</small></span><span class="tag">'+UL[it.u]+' ＋</span></button>'}
function itemsHtml(k){const L=S.items[k];if(k!=='pele')return '<h2>Itens</h2>'+L.map(itemBtn).join('');
return GR.map(g=>{const r=L.map((it,i)=>[it,i]).filter(p=>p[0].g===g);return r.length?'<h2>'+g+'</h2>'+r.map(p=>itemBtn(p[0],p[1])).join(''):''}).join('')}
function pes(k,e){const L=S.entries[k].filter(x=>x.item===e.item);return[L.indexOf(e)+1,L.length]}
const TASK={folhagem:'Lançar folhagem',pele:'Lançar pele e osso',flv:'Lançar FLV'};
const isDone=k=>!!(S.done&&S.done[k]===dt());
function tasksHtml(){return '<h2>Tarefas de hoje</h2><div class="sum">'+Object.keys(SECS).map(k=>{const dn=isDone(k),n=S.entries[k].length;return '<button class="tk'+(dn?' dn':'')+'" data-a="tk" data-k="'+k+'"><span class="ck">✓</span><span class="tn">'+TASK[k]+'</span><small>'+(dn?'Concluída':(n?n+' registro'+(n===1?'':'s')+' em andamento':'Pendente'))+'</small></button>'}).join('')+'</div>'}
function mgrView(){const k=view;return '<button class="back" data-a="done">‹ Concluir</button><h1>'+SECS[k].nome+'</h1><p style="color:var(--mut);margin:-6px 0 8px">Toque em um item para editar ou excluir.</p>'+(k==='pele'?GR:[null]).map(g=>{const r=S.items[k].map((it,i)=>[it,i]).filter(p=>g===null||p[0].g===g);return (g?'<h2>'+g+'</h2>':'')+r.map(p=>'<button class="item" data-a="edit" data-i="'+p[1]+'"><span>'+esc(p[0].n)+'<small>'+(p[0].c?'Código '+esc(p[0].c):'sem código')+' | '+UL[p[0].u]+'</small></span><span class="tag">Editar</span></button>').join('')}).join('')+'<button class="btn" data-a="new" style="margin-top:8px">+ Novo item</button>'}
function editSheet(i){const it=S.items[view][i];sheet={e:i};const UN={un:'Unidade (un)',kg:'Peso (kg)',cx:'Caixa (cx)'};
openSheet('<h1 style="margin:0">Editar item</h1><label>Nome</label><input id="nn" value="'+esc(it.n)+'">'+(view==='pele'?'<label>Grupo</label><select id="ng">'+GR.map(g=>'<option'+(g===it.g?' selected':'')+'>'+g+'</option>').join('')+'</select>':'<label>Unidade</label><select id="nu">'+['un','kg','cx'].map(u=>'<option value="'+u+'"'+(u===it.u?' selected':'')+'>'+UN[u]+'</option>').join('')+'</select>')+'<label>Código do produto</label><input id="cod" value="'+esc(it.c)+'"><button class="btn" data-a="se" style="margin-top:16px">Salvar alterações</button><div class="row" style="margin-top:8px"><button class="btn sec" data-a="cl">Cancelar</button><button class="btn dg" data-a="de">Excluir item</button></div>')}

for(const t of T){

if(!first)doc.addPage();first=false;
band();y=32;
if(k==='pele'){doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...AC);doc.text(String(t.g).toUpperCase(),M,y);y+=4}

doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(170,205,184);doc.text(n+(n===1?' pesagem':' pesagens'),PW-M-8,y+9,{align:'right'});
