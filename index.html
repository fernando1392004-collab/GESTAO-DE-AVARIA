<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatório de Descarte</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f7d4f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Descarte">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e2e0d8;--ac:#2f7d4f;--act:#fff;--dg:#b3402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171815;--card:#22231f;--tx:#f0efe9;--mut:#9a9a92;--bd:#34352f;--ac:#5fb883;--act:#10150f;--dg:#e07a68}}
:root[data-theme="dark"]{--bg:#171815;--card:#22231f;--tx:#f0efe9;--mut:#9a9a92;--bd:#34352f;--ac:#5fb883;--act:#10150f;--dg:#e07a68}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:22px;margin:6px 0 14px}h2{font-size:15px;margin:22px 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
button{font:inherit;color:inherit;cursor:pointer}
.big{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:10px}
.big b{font-size:19px;display:block}.big span{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.btn{background:var(--ac);color:var(--act);border:0;border-radius:12px;padding:14px;font-weight:600;width:100%}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.dg{background:transparent;color:var(--dg);border:1px solid var(--dg)}
.back{background:none;border:0;color:var(--ac);padding:6px 0;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin-bottom:8px;text-align:left}
.item small{color:var(--mut);display:block}.tag{font-size:12px;color:var(--mut);white-space:nowrap}
.ent{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-bottom:8px}
.ent img,.ent .ph{width:52px;height:52px;border-radius:8px;object-fit:cover;background:var(--bd);flex:none}
.ent .nm{flex:1;min-width:0;font-weight:600}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:11px;width:100%}
.ent input{width:78px;text-align:right;padding:8px}
.x{background:none;border:0;color:var(--dg);font-size:22px;padding:4px 8px}
.sum{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 14px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}.sum div:last-child{border:0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
#sheet.on{display:flex}
#sheet .in{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
#prev{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;display:none;z-index:9;max-width:90%}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:3}
.bar>div{max-width:560px;margin:0 auto}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"><div class="in" id="sin"></div></div>
<div id="toast"></div>
<input type="file" id="pf" accept="image/*" capture="environment" hidden>
<input type="file" id="rf" accept=".json,application/json" hidden>
<script>
const SECS={
folhagem:{nome:'Folhagem',sub:'Fornecedor 1651: Wictor'},
pele:{nome:'Pele e Osso',sub:'Itens de açougue'},
flv:{nome:'FLV',sub:'Descarte Hotfrut'}};
const I=(n,u)=>({n,u,c:''}),G=(n,g)=>({n,u:'kg',c:'',g});
const DEF={folhagem:[I('Alface regional','un'),I('Cebolinha','un'),I('Jambu','un'),I('Cheiro verde','un'),I('Chicória','un'),I('Kit folhagem','un'),I('Salsa','un'),I('Agrião','un'),I('Macaxeira','kg')],
pele:[G('Osso Traseiro','Traseiro'),G('Pele Traseira','Traseiro'),G('Saco Traseiro','Traseiro'),G('Osso Dianteiro','Dianteiro'),G('Pele Dianteira','Dianteiro'),G('Saco Dianteiro','Dianteiro'),G('Cabeça de Lombo','Caixaria'),G('Pele PA/Costela','Caixaria'),G('Saco PA/Costela','Caixaria')],
flv:[I('Tomate','kg'),I('Brócolis','kg'),I('Pitaya','kg'),I('Alface americano','kg'),I('Berinjela','kg'),I('Maçã nacional','kg'),I('Tangerina importada','kg'),I('Limão','kg'),I('Repolho verde','kg'),I('Coco','un'),I('Abacaxi','un')]};
let S={v:2,items:JSON.parse(JSON.stringify(DEF)),entries:{folhagem:[],pele:[],flv:[]}};
let dip=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;if(view==='home')render()});
let view='home',sheet=null,photo=null,armed=false;
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const UL={kg:'kg',un:'un',cx:'cx'};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
/* storage */
let db=null;
function openDb(){return new Promise(r=>{try{const q=indexedDB.open('descarte',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function load(){db=await openDb();if(!db)return;try{const v=await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});if(v&&v.items)S=v}catch(e){}migrate()}
let st;function save(){clearTimeout(st);st=setTimeout(()=>{try{db&&db.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(e){}},200)}
/* helpers */
const dt=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)};
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const fmt=n=>String(Math.round(n*1000)/1000).replace('.',',');
function totals(k){const m={};S.entries[k].forEach(e=>{m[e.item]=(m[e.item]||0)+e.qty});return Object.keys(m).map(n=>{const it=S.items[k].find(x=>x.n===n)||{u:'un',c:''};return{n,q:m[n],u:it.u,c:it.c,g:it.g}})}
function compress(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};im.onerror=()=>res(null);im.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}
const GR=['Traseiro','Dianteiro','Caixaria'];
const REN={'osso traseiro':['Osso Traseiro','Traseiro'],'pele traseira':['Pele Traseira','Traseiro'],'saco traseiro':['Saco Traseiro','Traseiro'],'osso diant':['Osso Dianteiro','Dianteiro'],'saco diant':['Saco Dianteiro','Dianteiro'],'pele diant':['Pele Dianteira','Dianteiro'],'cabeça de lombo (caixaria)':['Cabeça de Lombo','Caixaria'],'pele pa/costela':['Pele PA/Costela','Caixaria'],'saco pa/costela':['Saco PA/Costela','Caixaria']};
function migrate(){if(S.v>=2)return;const map={};
S.items.pele=S.items.pele.map(it=>{const r=REN[it.n.toLowerCase()];if(r){map[it.n]=r[0];return{...it,n:r[0],u:'kg',g:r[1]}}return{...it,u:'kg',g:it.g||'Caixaria'}});
S.entries.pele.forEach(e=>{if(map[e.item])e.item=map[e.item]});S.v=2}
function itemBtn(it,i){return '<button class="item" data-a="reg" data-i="'+i+'"><span>'+esc(it.n)+'<small>'+(it.c?'Código '+esc(it.c):'sem código')+'</small></span><span class="tag">'+UL[it.u]+' ＋</span></button>'}
function itemsHtml(k){const L=S.items[k];if(k!=='pele')return '<h2>Itens</h2>'+L.map(itemBtn).join('');
return GR.map(g=>{const r=L.map((it,i)=>[it,i]).filter(p=>p[0].g===g);return r.length?'<h2>'+g+'</h2>'+r.map(p=>itemBtn(p[0],p[1])).join(''):''}).join('')}
/* views */
function render(){$('#app').innerHTML=view==='home'?home():secView()}
function home(){
return '<h1>Relatório de Descarte</h1>'+(dip?'<button class="btn" data-a="inst" style="margin-bottom:12px">Instalar app</button>':'')+Object.keys(SECS).map(k=>{const n=S.entries[k].length;return '<button class="big" data-a="open" data-k="'+k+'"><b>'+SECS[k].nome+'</b><span>'+SECS[k].sub+' · '+n+' registro'+(n===1?'':'s')+'</span></button>'}).join('')+
'<h2>Backup</h2><div class="row"><button class="btn sec" data-a="bk">Criar backup</button><button class="btn sec" data-a="rs">Restaurar backup</button></div>'+'<h2>Instalar no celular</h2><div class="sum"><div><span>Android (Chrome)</span><span style="text-align:right">Menu ⋮ › Instalar app</span></div><div><span>iPhone (Safari)</span><span style="text-align:right">Compartilhar › Adicionar à Tela de Início</span></div></div>'}
function secView(){
const k=view,E=S.entries[k],T=totals(k);
return '<button class="back" data-a="home">‹ Voltar</button><h1>'+SECS[k].nome+'</h1>'+
itemsHtml(k)+
'<button class="btn sec" data-a="new">+ Novo item</button>'+
'<h2>Registros</h2>'+(E.length?E.map(e=>'<div class="ent">'+(e.photo?'<img src="'+e.photo+'" alt="">':'<div class="ph"></div>')+'<div class="nm">'+esc(e.item)+'</div><input inputmode="decimal" value="'+fmt(e.qty)+'" data-a="q" data-id="'+e.id+'"><button class="x" data-a="del" data-id="'+e.id+'" aria-label="Remover">×</button></div>').join(''):'<p style="color:var(--mut)">Nenhum registro ainda.</p>')+
(T.length?'<h2>Resumo</h2><div class="sum">'+T.map(t=>'<div><span>'+esc(t.n)+(t.c?' <small style="color:var(--mut)">#'+esc(t.c)+'</small>':'')+'</span><b>'+fmt(t.q)+' '+t.u+'</b></div>').join('')+'</div>':'')+
(E.length?'<div style="margin-top:16px"><button class="btn dg" data-a="clr">'+(armed?'Toque de novo para apagar tudo':'Novo relatório (limpar)')+'</button></div>':'')+
'<div class="bar"><div><button class="btn" data-a="pdf">Salvar PDF</button></div></div>'}
function openSheet(h){$('#sin').innerHTML=h;$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');sheet=null;photo=null}
function regSheet(i){const it=S.items[view][i];sheet={i};photo=null;
openSheet('<h1 style="margin:0">'+esc(it.n)+'</h1><label>Código do produto</label><input id="cod" value="'+esc(it.c)+'" placeholder="Digite o código"><label>Foto</label><button class="btn sec" data-a="ph">Tirar / escolher foto</button><img id="prev" alt=""><label>Quantidade ('+UL[it.u]+')</label><input id="qty" inputmode="decimal" placeholder="0"><div class="row" style="margin-top:16px"><button class="btn sec" data-a="cl">Cancelar</button><button class="btn" data-a="add">Adicionar</button></div>')}
function newSheet(){sheet={n:1};openSheet('<h1 style="margin:0">Novo item</h1><label>Nome</label><input id="nn">'+(view==='pele'?'<select id="nu" style="display:none">':'<label>Unidade</label><select id="nu">')+'<option value="un">Unidade (un)</option><option value="kg">Peso (kg)</option><option value="cx">Caixa (cx)</option></select>'+(view==='pele'?'<label>Grupo</label><select id="ng"><option value="Traseiro">Traseiro</option><option value="Dianteiro">Dianteiro</option><option value="Caixaria">Caixaria</option></select>':'')+'<label>Código do produto</label><input id="cod" placeholder="Digite o código"><div class="row" style="margin-top:16px"><button class="btn sec" data-a="cl">Cancelar</button><button class="btn" data-a="sn">Salvar item</button></div>')}
/* actions */
document.addEventListener('click',async ev=>{
const b=ev.target.closest('[data-a]');if(!b){if(ev.target.id==='sheet')closeSheet();return}
const a=b.dataset.a,k=view;
if(a==='open'){view=b.dataset.k;armed=false;render();scrollTo(0,0)}
else if(a==='home'){view='home';render()}
else if(a==='reg')regSheet(+b.dataset.i);
else if(a==='new')newSheet();
else if(a==='cl')closeSheet();
else if(a==='ph')$('#pf').click();
else if(a==='add'){const it=S.items[k][sheet.i],q=num($('#qty').value);if(q<=0){toast('Informe a quantidade');return}
it.c=$('#cod').value.trim();S.entries[k].push({id:Date.now()+Math.random(),item:it.n,qty:q,photo});save();closeSheet();render();toast('Registro adicionado')}
else if(a==='sn'){const n=$('#nn').value.trim();if(!n){toast('Informe o nome');return}
S.items[k].push(k==='pele'?{n,u:'kg',c:$('#cod').value.trim(),g:$('#ng').value}:{n,u:$('#nu').value,c:$('#cod').value.trim()});save();closeSheet();render()}
else if(a==='del'){S.entries[k]=S.entries[k].filter(e=>String(e.id)!==b.dataset.id);save();render()}
else if(a==='clr'){if(!armed){armed=true;render();setTimeout(()=>{armed=false;if(view===k)render()},4000)}else{S.entries[k]=[];armed=false;save();render()}}
else if(a==='pdf')await makePdf(k);
else if(a==='inst'&&dip){dip.prompt();dip=null;render()}
else if(a==='bk')await backup();
else if(a==='rs')$('#rf').click();
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.a==='q'){const en=S.entries[view].find(x=>String(x.id)===t.dataset.id);const q=num(t.value);if(en&&q>0){en.qty=q;save()}render()}});
$('#pf').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;photo=await compress(f);const p=$('#prev');if(p&&photo){p.src=photo;p.style.display='block'}});
$('#rf').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const v=JSON.parse(r.result);if(!v.items||!v.entries)throw 0;S=v;migrate();save();view='home';render();toast('Backup restaurado')}catch(x){toast('Arquivo de backup inválido')}};r.readAsText(f)});
async function dl(name,data){const blob=data instanceof Blob?data:new Blob([data],{type:'application/json'});
try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),8000);return true}catch(e){toast('Não foi possível salvar');return false}}
async function backup(){await dl('backup-descarte '+dt()+'.json',JSON.stringify(S))}
async function makePdf(k){
const E=S.entries[k];if(!E.length){toast('Adicione ao menos um registro');return}
if(!window.jspdf){toast('PDF indisponível (sem internet?)');return}
const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a4'}),d=dt();
const title=k==='folhagem'?'Relação de Folhagem Fornecedor 1651: Wictor REF. '+d:'Relatório Descarte '+SECS[k].nome+' REF. '+d;
const AC=[47,125,79],TX=[29,29,27],MU=[125,125,118],LN=[226,224,217];
const li=s=>new Promise(r=>{if(!s)return r(null);const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
const T=totals(k),fol=k==='folhagem';
const bar=()=>{doc.setFillColor(...AC);doc.rect(0,0,210,2.5,'F')};
bar();doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...AC);doc.text(fol?'RELAÇÃO DE FOLHAGEM':'RELATÓRIO DE DESCARTE',14,15);
doc.setFontSize(21);doc.setTextColor(...TX);doc.text(fol?'Fornecedor 1651: Wictor':SECS[k].nome,14,25);
doc.setFontSize(8);doc.setTextColor(...MU);doc.text('REF.',196,15,{align:'right'});doc.setFontSize(15);doc.setTextColor(...TX);doc.text(d,196,24,{align:'right'});
doc.setDrawColor(...LN);doc.line(14,30,196,30);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...MU);doc.text(E.length+' registros  |  '+T.length+' itens',14,36);
const W=87,IH=60,H=IH+17,xs=[14,109];let y=42,c=0;
for(const e of E){if(y+H>282){doc.addPage();bar();y=14;c=0}
const x=xs[c],im=await li(e.photo);
doc.setDrawColor(...LN);doc.roundedRect(x,y,W,H,2,2,'S');
doc.setFillColor(246,245,241);doc.rect(x+1,y+1,W-2,IH-1,'F');
if(im){const r=Math.min((W-4)/im.width,(IH-4)/im.height),w=im.width*r,h=im.height*r;try{doc.addImage(e.photo,'JPEG',x+(W-w)/2,y+1+(IH-1-h)/2,w,h,undefined,'FAST')}catch(z){}}
else{doc.setFontSize(9);doc.setTextColor(...MU);doc.text('Sem foto',x+W/2,y+IH/2,{align:'center'})}
const it=S.items[k].find(i=>i.n===e.item)||{u:'un',c:''};
doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...TX);doc.text(e.item,x+4,y+IH+7);
doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(...MU);doc.text(fmt(e.qty)+' '+it.u+(it.c?'   |   Cód. '+it.c:''),x+4,y+IH+13);
c++;if(c>1){c=0;y+=H+6}}
doc.addPage();bar();y=20;doc.setFont('helvetica','bold');doc.setFontSize(16);doc.setTextColor(...TX);doc.text('Listagem de itens',14,y);y+=8;
const th=()=>{doc.setFillColor(...AC);doc.rect(14,y,182,8,'F');doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(255,255,255);doc.text('ITEM',17,y+5.4);doc.text('QUANTIDADE',152,y+5.4,{align:'right'});doc.text('CÓDIGO',162,y+5.4);y+=8};
th();
const rows=[];if(k==='pele')GR.forEach(g=>{const r=T.filter(t=>t.g===g);if(r.length){rows.push({g});r.forEach(t=>rows.push(t))}});else T.forEach(t=>rows.push(t));
let z=0;
rows.forEach(r=>{if(y>278){doc.addPage();bar();y=16;th();z=0}
if(r.g){doc.setFillColor(231,240,234);doc.rect(14,y,182,7,'F');doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(...AC);doc.text(r.g.toUpperCase(),17,y+4.9);y+=7;z=0;return}
if(z%2===0){doc.setFillColor(248,247,244);doc.rect(14,y,182,8,'F')}z++;
doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(...TX);doc.text(r.n,17,y+5.4);doc.text(fmt(r.q)+' '+r.u,152,y+5.4,{align:'right'});doc.text(r.c||'-',162,y+5.4);y+=8});
doc.setDrawColor(...LN);doc.line(14,y,196,y);
const N=doc.getNumberOfPages();for(let p=1;p<=N;p++){doc.setPage(p);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(...MU);doc.text('Gerado em '+d,14,290);doc.text('Página '+p+' de '+N,196,290,{align:'right'})}
const name=title.replace(/[:\/\\]/g,'')+'.pdf';
if(await dl(name,doc.output('blob')))toast('PDF salvo')}
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async()=>{await load();render()})();
</script>
</body>
</html>
